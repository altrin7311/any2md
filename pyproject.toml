[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "any2md-cli"
dynamic = ["version"]
description = "Convert almost anything to Obsidian-flavored Markdown for a knowledge graph."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Altrin Titus", email = "altrintitus@gmail.com" }]
keywords = ["markdown", "obsidian", "knowledge-graph", "converter", "cli", "youtube", "reddit"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Topic :: Utilities",
]
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "tomli-w>=1.0",
    "markitdown[docx,pdf,xlsx,pptx]>=0.1.0",
    "httpx>=0.27",
    "yt-dlp>=2024.1",
    "trafilatura>=1.12",
    "prompt_toolkit>=3.0",
]

[project.optional-dependencies]
serve = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.urls]
Homepage = "https://github.com/altrin7311/any2md"
Repository = "https://github.com/altrin7311/any2md"
Issues = "https://github.com/altrin7311/any2md/issues"

[project.scripts]
any2md = "any2md.cli:main"

[tool.setuptools.dynamic]
version = { attr = "any2md.__version__" }

[tool.setuptools.packages.find]
include = ["any2md*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
# Pin first-party so single-file (hook) and whole-project isort can never disagree.
known-first-party = ["any2md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
